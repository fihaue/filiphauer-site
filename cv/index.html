<!doctype html>
<!-- Old or short address /cv → /#about
     A real page (not the 404 page), so search engines treat it as a permanent redirect.
     The list of these addresses is in 404.html (OLD_PAGES). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Filip Hauer</title>
  <meta http-equiv="refresh" content="0; url=/#about">
  <script>location.replace("/#about" + ("/#about".includes("#") ? "" : location.hash));</script>
</head>
<body><p><a href="/#about">Filip Hauer</a></p></body>
</html>
