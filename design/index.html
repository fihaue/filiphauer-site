<!doctype html>
<!-- Old or short address /design → /?layout=d
     A real page (not the 404 page), so search engines treat it as a permanent redirect.
     The list of these addresses is in 404.html (OLD_PAGES). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Filip Hauer</title>
  <meta http-equiv="refresh" content="0; url=/?layout=d">
  <script>location.replace("/?layout=d" + ("/?layout=d".includes("#") ? "" : location.hash));</script>
</head>
<body><p><a href="/?layout=d">Filip Hauer</a></p></body>
</html>
