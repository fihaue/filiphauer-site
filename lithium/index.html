<!doctype html>
<!-- Old or short address /lithium → /#lithium
     A real page (not the 404 page), so search engines treat it as a permanent redirect.
     The list of these addresses is in 404.html (OLD_PAGES). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Filip Hauer</title>
  <meta http-equiv="refresh" content="0; url=/#lithium">
  <script>location.replace("/#lithium" + ("/#lithium".includes("#") ? "" : location.hash));</script>
</head>
<body><p><a href="/#lithium">Filip Hauer</a></p></body>
</html>
