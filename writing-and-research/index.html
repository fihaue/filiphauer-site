<!doctype html>

     The list of these addresses is in 404.html (OLD_PAGES). -->

  <title>Filip Hauer</title>
  <meta http-equiv="refresh" content="0; url=/#writing">

</head>
<body><p><a href="/#writing">Filip Hauer</a></p></body>
</html>
